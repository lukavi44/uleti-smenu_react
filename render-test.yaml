# Render Blueprint - UletiSmenu frontend (TEST environment)
# Connect repo in Render dashboard: Blueprint path = render-test.yaml

services:
  - type: web
    name: uletismenu-web-test
    runtime: static
    plan: free
    rootDir: uleti-smenu
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api-test.uletismenu.com
