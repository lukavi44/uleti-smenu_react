name: CI - frontend lint and build

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

defaults:
  run:
    working-directory: uleti-smenu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: uleti-smenu/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (TEST API URL)
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api-test.uletismenu.com
